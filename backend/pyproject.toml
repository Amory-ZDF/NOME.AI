[project]
name = "nome-backend"
version = "0.1.0"
description = "NOME.AI Backend — agent-driven tutoring engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.10",
    "httpx>=0.28",
    "networkx>=3.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.33",
    "httpx-sse>=0.4",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that require a live LLM (skipped in CI with -m 'not integration')",
]
