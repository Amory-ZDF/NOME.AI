services:
  postgres:
    image: postgres:16
    container_name: nome-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nome
      POSTGRES_PASSWORD: nome
      POSTGRES_DB: nome
    ports:
      - "5432:5432"
    volumes:
      - nome_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nome -d nome"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nome_pgdata:
