<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOME.AI · 教师端</title>
  <link href="https://fonts.cdnfonts.com/css/satoshi" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/layout.css">
  <style>
    /* 加载状态 */
    .app-loading {
      position: fixed;
      inset: 0;
      background: var(--warm-paper);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1.5rem;
      z-index: 1000;
    }
    .app-loading-logo {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--deep-ink);
      letter-spacing: -0.02em;
    }
    .app-loading-spinner {
      width: 2rem;
      height: 2rem;
      border: 2px solid var(--whisper-line);
      border-top-color: var(--deep-teal);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 全局滚动条 */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gray-400); }
  </style>
</head>
<body>

  <!-- 加载状态 -->
  <div class="app-loading" id="appLoading">
    <div class="app-loading-logo">NOME.AI</div>
    <div class="app-loading-spinner"></div>
  </div>

  <script src="js/i18n.js"></script>
  <script src="js/common.js"></script>
  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/calendar.js"></script>
  <script src="js/pages/assignments.js"></script>
  <script src="js/pages/students.js"></script>
  <script src="js/pages/student-profile.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/insights.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/not-found.js"></script>

  <script>
    // 初始化应用
    document.addEventListener('DOMContentLoaded', function() {
      // 模拟加载延迟
      setTimeout(() => {
        App.init({ user: MockData.user, activeNav: 'dashboard' });
        const loading = document.getElementById('appLoading');
        if (loading) {
          loading.style.transition = 'opacity 300ms';
          loading.style.opacity = '0';
          setTimeout(() => loading.remove(), 300);
        }
      }, 400);
    });
  </script>

</body>
</html>
